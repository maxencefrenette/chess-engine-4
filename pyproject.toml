[project]
name = "chess-engine-4"
version = "0.1.0"
description = "Lc0-compatible chess neural network training code."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "GPL-3.0-only" }
dependencies = [
    "chess>=1.11",
    "modal>=1.4.2",
    "ninja>=1.13; sys_platform == 'linux'",
    "numpy>=2.2",
    "nvidia-cuda-cccl>=13.0; sys_platform == 'linux'",
    "nvidia-cuda-crt==13.0.88; sys_platform == 'linux'",
    "nvidia-cuda-nvcc==13.0.88; sys_platform == 'linux'",
    "nvidia-nvvm==13.0.88; sys_platform == 'linux'",
    "pybind11>=3.0; sys_platform == 'linux'",
    "python-dotenv>=1.2.2",
    "safetensors>=0.6.2",
    "scipy>=1.18.0",
    "tomli-w>=1.2.0",
    "torch==2.11.0",
    "transformer-engine[core-cu13,pytorch]==2.17.0; sys_platform == 'linux'",
    "wandb>=0.26.1",
]

[project.scripts]
train-modal = "chess_engine_4.modal_train:train_modal"
profile-training = "chess_engine_4.modal_profile:profile_training"
build-kernels = "chess_engine_4.kernels.build:build_kernels"
build-lc0 = "chess_engine_4.build_lc0:build_lc0"
benchmark-training-modal = "chess_engine_4.modal_training_benchmark:benchmark_training_modal"
benchmark-moe-kernels-modal = "chess_engine_4.modal_moe_kernels:benchmark_moe_kernels_modal"
throughput-sweep = "chess_engine_4.training.throughput_sweep:throughput_sweep"
plan-budget = "chess_engine_4.training.budget_planner:budget_planner"
eval-modal = "chess_engine_4.modal_eval:eval_modal"
eval-selfplay-modal = "chess_engine_4.modal_eval:eval_selfplay_modal"
eval-tournament-modal = "chess_engine_4.evaluation.tournament:eval_tournament_modal"
eval-precision-modal = "chess_engine_4.modal_precision_eval:eval_precision_modal"
prepare-lc0-modal = "chess_engine_4.modal_eval:prepare_lc0_modal"
benchmark-lc0-modal = "chess_engine_4.modal_eval:benchmark_lc0_modal"
benchmark-tournament-modal = "chess_engine_4.evaluation.backendbench:benchmark_tournament_modal"
inspect-data = "chess_engine_4.training.cli:inspect_data"
lc0-to-parquet = "chess_engine_4.data.parquet:lc0_to_parquet"
convert-data-modal = "chess_engine_4.modal_data:convert_data_modal"
verify-data-modal = "chess_engine_4.modal_data:verify_data_modal"
inspect-subsampling-sources-modal = "chess_engine_4.modal_data:inspect_subsampling_sources_modal"
export-scaling-data = "chess_engine_4.training.export_scaling_data:export_scaling_data"
website = "chess_engine_4.website:website"
wandb-metrics = "chess_engine_4.training.wandb_metrics:wandb_metrics"
compare-run = "chess_engine_4.training.compare_run:compare_run"
export-model = "chess_engine_4.training.export_model:export_model"

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "maturin>=1.13.3",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.ruff]
exclude = ["third_party"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
