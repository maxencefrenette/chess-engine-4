[tools]
python = "3.14"
rust = "1.95"
uv = "latest"
"ubi:driangle/taskmd" = "0.3.0"

[tasks.test]
description = "Run the test suite."
run = "uv run pytest"

[tasks.lint]
description = "Run lint checks."
run = "uv run ruff check ."

[tasks.typecheck]
description = "Run Python type checks."
run = "uv run ty check"

[tasks.setup-cuda]
description = "Install local CUDA training dependencies and build the native data loader."
run = '''
NVTE_BUILD_USE_NVIDIA_WHEELS=1 \
NVTE_FRAMEWORK=pytorch \
NVTE_WITH_NCCL_EP=0 \
PATH="$PWD/.venv/lib/python3.14/site-packages/nvidia/cu13/bin:$PATH" \
uv sync --dev --extra cuda --no-build-isolation-package transformer-engine-torch
uv run maturin develop --manifest-path crates/leela_loader/Cargo.toml --release
'''
