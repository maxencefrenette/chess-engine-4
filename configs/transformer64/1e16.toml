[run]
name = "transformer64-1e16"
seed = 1
compute_budget = 1e16
step_penalty_k = 1.2

[infra]
gpu_type = "l4"
dataloader_prefetch_factor = 2

[data]
batch_size = 1536

[model]
kind = "transformer64"
d_model = 80
depth = 3
num_heads = 4
mlp_ratio = 4.0
rms_norm_eps = 1e-6
learned_square_embeddings = true

[model.policy]
kind = "attention"

[optimizer]
lr = 2.45e-4
weight_decay = 0.01

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
