[run]
name = "transformer64-1e14"
seed = 1
compute_budget = 1e14
step_penalty_k = 1.2
log_every = 10
device = "auto"

[data]
batch_size = 192

[model]
kind = "transformer64"
d_model = 96
depth = 2
num_heads = 4
mlp_ratio = 4.0
rms_norm_eps = 1e-6
learned_square_embeddings = true

[model.policy]
kind = "attention"

[optimizer]
lr = 1e-3
weight_decay = 0.01

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
