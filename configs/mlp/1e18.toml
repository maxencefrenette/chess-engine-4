[run]
name = "mlp-1e18"
seed = 1
compute_budget = 1e18
step_penalty_k = 2.0

[infra]
gpu_type = "l4"
dataloader_threads = 4
dataloader_prefetch_per_thread = 2

[data]
batch_size = 2048

[model]
kind = "mlp"
d_model = 80
depth = 3
mlp_ratio = 4.0
rms_norm_eps = 1e-6

[optimizer]
lr = 1.2e-3
weight_decay = 0.01

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
