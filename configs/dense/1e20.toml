[run]
name = "dense-1e20"
seed = 1
compute_budget = 1e20
step_penalty_k = 2.0

[infra]
cpu_cores = 8
dataloader_threads = 8
dataloader_prefetch_per_thread = 2

[data]
batch_size = 16384

[precision]
recipe = "mxfp8"

[model]
kind = "dense"
d_model = 288
depth = 5
expansion_ratio = 4.0
rms_norm_eps = 1e-6

[optimizer]
lr = 7.5e-4
weight_decay = 0.01
max_grad_norm = 1.0
lr_cooldown_frac = 0.1

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
