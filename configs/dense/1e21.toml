[run]
name = "dense-1e21"
seed = 1
compute_budget = 1e21
step_penalty_k = 2.0

[infra]
dataloader_threads = 8
dataloader_prefetch_per_thread = 2

[data]
batch_size = 32768

[precision]
recipe = "mxfp8"

[model]
kind = "mlp"
d_model = 512
depth = 5
mlp_ratio = 4.0
rms_norm_eps = 1e-6

[optimizer]
lr = 2e-4
weight_decay = 0.01
max_grad_norm = 1.0
lr_cooldown_frac = 0.1

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
