[run]
name = "mlp_moe16a2-1e20"
seed = 1
compute_budget = 1e20
step_penalty_k = 2.0

[infra]
gpu_type = "l4"
dataloader_threads = 4
dataloader_prefetch_per_thread = 2

[data]
batch_size = 12288

[model]
kind = "mlp_moe"
d_model = 320
depth = 4
expert_mlp_ratio = 2.0
num_experts = 16
num_experts_per_token = 2
rms_norm_eps = 1e-6

[optimizer]
lr = 5e-4
weight_decay = 0.01
lr_cooldown_frac = 0.1

[loss]
policy = 1.0
value = 1.0
moves_left = 1.0
router_aux = 0.03
